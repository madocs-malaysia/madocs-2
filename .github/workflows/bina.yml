name: Bina laman MADOCS

# Setiap kali kandungan (data/), gaya (_src/), gambar (assets/) atau skrip bina diubah,
# laman dibina semula dan hasilnya diterbitkan automatik. Ini membolehkan AJK mengemas
# kini kandungan terus dari pelayar GitHub tanpa perlu memasang apa-apa dalam komputer.
#
# KESELAMATAN: tindakan (actions) dipin pada commit SHA penuh, bukan tag boleh gerak
# (v4/v5). Ini menghalang serangan rantaian bekalan jika tag sesuatu tindakan dialihkan
# kepada kod berniat jahat. Kemas kini SHA secara sedar apabila mahu naik versi.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "_src/**"
      - "_icons/**"
      - "assets/**"
      - "build.py"
      - "terjemah.py"
      - "app.js"
  workflow_dispatch:

# Kebenaran minimum yang diperlukan: tulis kandungan untuk commit hasil bina semula.
permissions:
  contents: write

concurrency:
  group: bina-laman
  cancel-in-progress: false

jobs:
  bina:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kod
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Sediakan Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Sahkan skrip bina (tiada ralat sintaks)
        run: python -c "import ast,pathlib; [ast.parse(pathlib.Path(f).read_text(encoding='utf-8')) for f in ('build.py','terjemah.py')]"

      - name: Pasang kebergantungan imej
        run: python -m pip install --quiet "Pillow==13.0.0"

      - name: Bina laman
        run: python build.py

      - name: Terbitkan jika ada perubahan
        run: |
          git config user.name "MADOCS bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "bina automatik: kandungan dikemas kini"
            git push origin HEAD:main
          else
            echo "Tiada perubahan selepas bina — laman sudah terkini."
          fi
